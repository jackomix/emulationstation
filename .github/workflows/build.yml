name: Build EmulationStation (R36S ARM64)

on:
  push:
    branches: [ main, master, attempt2 ]
  pull_request:
    branches: [ main, master, attempt2 ]
  workflow_dispatch:

jobs:
  build-r36s:
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git libsdl2-dev libsdl2-mixer-dev libfreeimage-dev \
            libfreetype6-dev libcurl4-openssl-dev rapidjson-dev \
            libasound2-dev libvlc-dev libvlccore-dev vlc-bin \
            libboost-all-dev libeigen3-dev \
            libgles2-mesa-dev libcec-dev libudev-dev gettext ca-certificates ccache

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ runner.os }}-ccache-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Build
        run: |
          mkdir -p build
          cd build
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DGLES2=ON \
            -DENABLE_AMBERELEC=ON \
            -DRG351P=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            ..
          make -j$(nproc)
          cd ..
          strip emulationstation
          mkdir -p ports
          cp setup_boot_hook.sh ports/
          cp print_filesystem.sh ports/
          mkdir -p EmulationStation
          cp emulationstation EmulationStation/
          cp -r resources EmulationStation/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: emulationstation-r36s
          path: |
            ports
            EmulationStation
            tools
